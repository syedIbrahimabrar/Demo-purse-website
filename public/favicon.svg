<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C396"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#967850"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18222E"/>
      <stop offset="100%" stop-color="#0E1622"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Luxury Rounded Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Stylized Luxury Handbag Arch / Handle Monogram Motif -->
  <path d="M 22 26 C 22 17, 42 17, 42 26" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Sculpted 'A' Serif Monogram -->
  <text x="32" y="47" font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" font-size="29" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">A</text>
  
  <!-- Small Bottom Jewel Diamond Accent -->
  <polygon points="32,53 34,55 32,57 30,55" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
